<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library — AboveTuna</title>
  <meta name="description" content="AboveTuna is an independent game studio from South Africa, making cosy, characterful games to play with friends.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <div class="wp-main">

    <!-- nav -->
    <header id="wp-navheader">
      <div id="wp-navbar">
        <a href="../index.html" class="wp-navlink-back wp-navL">
          <span class="wp-ico wp-ico--26 wp-ico--light">←</span>
          Home
        </a>
        <a href="../index.html" id="wp-logo">
          <span class="wp-wordmark">AboveTuna</span>
        </a>
        <a href="https://store.steampowered.com/app/4974600/Hidden_in_Plain_Cake/" class="wp-btn wp-btn--yellow wp-cta-navwish wp-navR">★
          Wishlist</a>
      </div>
    </header>

    <!-- game library -->
    <section class="wp-library">

      <!-- heading row -->
      <div class="wp-library-head">
        <div>
          <div class="wp-eyebrow">
            <span class="wp-eyebrow-dash"></span>
            EXPLORE
          </div>
          <h1 class="wp-heading wp-library-title">Game Library</h1>
        </div>
        <span class="wp-games-meta">Every AboveTuna game, all in one place</span>
      </div>

      <!-- card template (same structure as the home page) -->
      <template class="wp-card-template">
        <a href="" class="wp-card-link wp-card">
          <!-- card key art -->
          <div class="wp-card-art">
            <span class="wp-card-tag">Game Tag</span>
          </div>
          <!-- card body -->
          <div class="wp-card-body">
            <div class="wp-heading wp-card-title">Title</div>
            <p class="wp-card-desc">Description</p>
            <div class="wp-card-foot">
              <span class="wp-card-year">Year</span>
              <span class="wp-card-cta">View game
                <span class="wp-ico wp-ico--24 wp-ico--yellow">→</span>
              </span>
            </div>
          </div>
        </a>
      </template>

      <!-- vertical grid of game cards (populated by library.js) -->
      <div class="wp-library-grid"></div>

    </section>

    <!-- footer -->
    <footer class="wp-game-footer">
      <a href="../index.html" class="wp-game-footer-back">
        <span class="wp-ico wp-ico--22 wp-ico--yellow">←</span>
        <span class="wp-wordmark">AboveTuna</span>
      </a>
      <span class="wp-game-copyright">© 2026 AboveTuna.</span>
    </footer>

  </div>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/library.js"></script>

</body>

</html>
