<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <div class="wp-main">

    <!-- nav -->
    <header id="wp-navheader">
      <div id="wp-navbar">
        <a href="../index.html" class="wp-navlink-back wp-navL">
          <span class="wp-ico wp-ico--26 wp-ico--light">←</span>
          Home
        </a>
        <a href="../index.html" id="wp-logo">
          <span class="wp-wordmark">Dior Zaverdino</span>
        </a>
        <a href="#" class="wp-btn wp-btn--yellow wp-cta-navwish wp-navR">★
          Wishlist</a>
      </div>
    </header>

    <!-- contact form -->
    <section class="wp-contact">
      <div class="wp-contact-grid">

        <!-- intro column -->
        <div class="wp-contact-intro">
          <span class="wp-eyebrow"><span class="wp-eyebrow-dash"></span>GET IN TOUCH</span>
          <h1 class="wp-heading wp-contact-title">Let's talk</h1>
          <p class="wp-contact-lead">
            Have a question about a game, a press enquiry, or just want to say hi?
            Drop a message below and I'll get back to you.
          </p>

          <ul class="wp-contact-points">
            <li class="wp-contact-point">
              <span class="wp-ico wp-ico--24 wp-ico--dark">✉</span>
              <a href="mailto:dior.zaverdino@gmail.com">dior.zaverdino@gmail.com</a>
            </li>
            <li class="wp-contact-point">
              <span class="wp-ico wp-ico--24 wp-ico--light">⏱</span>
              <span>Usually replies within 2 business days</span>
            </li>
          </ul>
        </div>

        <!-- form column -->
        <form class="wp-contact-card" id="wp-contact-form" novalidate>
          <div class="wp-field">
            <label class="wp-label" for="wp-name">Name</label>
            <input class="wp-input" id="wp-name" name="name" type="text" placeholder="Your name"
              autocomplete="name" required>
            <span class="wp-error" data-error-for="name"></span>
          </div>

          <div class="wp-field">
            <label class="wp-label" for="wp-email">Email</label>
            <input class="wp-input" id="wp-email" name="email" type="email" placeholder="you@example.com"
              autocomplete="email" required>
            <span class="wp-error" data-error-for="email"></span>
          </div>

          <div class="wp-field">
            <label class="wp-label" for="wp-subject">Subject</label>
            <select class="wp-input" id="wp-subject" name="subject" required>
              <option value="" disabled selected>Choose a topic…</option>
              <option value="general">General question</option>
              <option value="press">Press / media</option>
              <option value="support">Game support</option>
              <option value="business">Business / partnership</option>
            </select>
            <span class="wp-error" data-error-for="subject"></span>
          </div>

          <div class="wp-field">
            <label class="wp-label" for="wp-message">Message</label>
            <textarea class="wp-input wp-textarea" id="wp-message" name="message" rows="5"
              placeholder="Tell me what's on your mind…" required></textarea>
            <span class="wp-error" data-error-for="message"></span>
          </div>

          <button class="wp-btn wp-btn--yellow wp-contact-submit" type="submit">
            Send message
            <span class="wp-ico wp-ico--22 wp-ico--dark">→</span>
          </button>

          <p class="wp-contact-status" id="wp-contact-status" role="status" aria-live="polite"></p>
        </form>

      </div>
    </section>


    <!-- footer -->
    <footer class="wp-game-footer">
      <a href="../index.html" class="wp-game-footer-back">
        <span class="wp-ico wp-ico--22 wp-ico--yellow">←</span>
        <span class="wp-wordmark">
          Dior Zaverdino
        </span>
      </a>
      <span class="wp-game-copyright">© 2026 Dior Zaverdino.</span>
    </footer>

  </div>

  <script src="../scripts/contact.js"></script>

</body>

</html>
