<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game — AboveTuna</title>
  <meta name="description" content="AboveTuna is an independent game studio from South Africa, making cosy, characterful games to play with friends.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles.css">
</head>

<body>

  <div class="wp-main">

    <!-- nav -->
    <header id="wp-navheader">
      <div id="wp-navbar">
        <a href="gamelibrary.html" class="wp-navlink-back wp-navL">
          <span class="wp-ico wp-ico--26 wp-ico--light">←</span>
          All games
        </a>
        <a href="../index.html" id="wp-logo">
          <span class="wp-wordmark">AboveTuna</span>
        </a>
        <a href="https://store.steampowered.com/app/4974600/Hidden_in_Plain_Cake/" class="wp-btn wp-btn--yellow wp-cta-navwish wp-navR">★
          Wishlist</a>
      </div>
    </header>

    <!-- hero -->
    <section class="wp-game-hero">
      <!-- parallax background layer (art applied by pagegame.js) -->
      <div id="wp-game-hero-bg"></div>
      <!-- bottom scrim keeps the title readable over light key art -->
      <div class="wp-game-hero-scrim"></div>
      <div class="wp-game-hero-inner">
        <div class="wp-hero-in wp-delay-1 wp-game-badge">
          tag · year</div>
        <h1 class="wp-hero-in wp-delay-2 wp-heading wp-game-title">
          title</h1>
        <div class="wp-hero-in wp-delay-3 wp-game-actions">
          <a href="#" class="wp-btn wp-btn--dark wp-cta-wishlist">★
            Wishlist now</a>
          <a href="#wp-trailer" class="wp-btn wp-btn--glass wp-cta-trailer">▶
            Watch trailer</a>
        </div>
      </div>
    </section>

    <!-- overview + details -->
    <section id="wp-detail-grid" class="wp-reveal">
      <div>
        <div class="wp-eyebrow">
          <span class="wp-eyebrow-dash"></span>OVERVIEW
        </div>
        <p class="wp-game-lead">
          Game Lead
        </p>
        <p class="wp-game-text">
          Details
        </p>
        <div class="wp-tags-label">TAGS</div>
        <div class="wp-tag-row">
          <!-- tag pills injected by pagegame.js -->
        </div>
      </div>

      <div class="wp-detail-card">
        <div class="wp-detail-title">
          DETAILS
        </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Developer</span>
            <span class="wp-detail-v wp-detail-developer">AboveTuna</span>
          </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Released</span>
            <span class="wp-detail-v wp-detail-released">—</span>
          </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Platform</span>
            <span class="wp-detail-v wp-detail-platform">Windows</span>
          </div>
          <div class="wp-detail-row">
            <span class="wp-detail-k">Available on</span>
            <span class="wp-detail-v wp-detail-store">Itch</span>
          </div>
        <a href="https://abovetuna.itch.io/" class="wp-cta-buy">
          Play Now
        </a>
      </div>
    </section>

    <!-- trailer (HLS stream wired up by pagegame.js; hidden if the game has none) -->
    <section id="wp-trailer" class="wp-reveal wp-trailer-section">
      <div class="wp-eyebrow wp-shots-head">
        <span class="wp-eyebrow-dash"></span>TRAILER
      </div>
      <video class="wp-trailer" controls playsinline preload="none"></video>
    </section>

    <!-- screenshots -->
    <section class="wp-reveal wp-shots-section">
      <div class="wp-eyebrow wp-shots-head">
        <span class="wp-eyebrow-dash"></span>SCREENSHOTS
      </div>
      <div class="wp-scroll wp-shots-scroll">
        <div class="wp-shot"> </div>
        <div class="wp-shot"> </div>
        <div class="wp-shot"> </div>
      </div>
    </section>

    <!-- footer -->
    <footer class="wp-game-footer">
      <a href="../index.html" class="wp-game-footer-back">
        <span class="wp-ico wp-ico--22 wp-ico--yellow">←</span>
        <span class="wp-wordmark">AboveTuna</span>
      </a>
      <span class="wp-game-copyright">© 2026 AboveTuna.</span>
    </footer>

  </div>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/pagegame.js"></script>

</body>

</html>
